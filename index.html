<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1552a0"><meta name="description" content="St. Mark Report - نظام التقارير اليومية"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>St. Mark Report</title>
<style>
:root{--blue:#1552a0;--orange:#f39818;--ink:#18283d;--muted:#65758b;--bg:#f3f6fb;--line:#dfe6ef;--white:#fff;--red:#b42318;--green:#16804a}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary{background:var(--blue);color:white}.accent{background:var(--orange);color:#1c2738}.soft{background:#eaf0f8;color:var(--blue)}.danger{background:#feeceb;color:var(--red)}.shell{max-width:1280px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--white);padding:16px 20px;border-bottom:3px solid var(--orange);box-shadow:0 3px 14px #102c5010}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px}.brand h1{font-size:19px;margin:0;color:var(--blue)}.brand p{margin:4px 0 0;font-size:12px;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px #17345a08}.login{max-width:460px;margin:7vh auto}.login h2,.card h2{margin:0 0 8px;color:var(--blue)}.muted{color:var(--muted);font-size:13px;line-height:1.7}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd6e4;border-radius:10px;padding:12px;background:white;min-height:44px;outline-color:var(--blue)}textarea{resize:vertical;min-height:130px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;margin-top:20px}.nav{display:grid;gap:8px;align-content:start}.nav button{text-align:right;background:white;border:1px solid var(--line);color:var(--ink)}.nav button.active{background:var(--blue);color:white}.content{min-width:0}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}.stat strong{display:block;color:var(--blue);font-size:25px;margin-top:7px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:14px}table{border-collapse:collapse;width:100%;min-width:780px;background:white}th,td{padding:12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{background:#edf3fb;color:var(--blue)}tr:last-child td{border-bottom:0}.tag{display:inline-block;background:#eaf0f8;color:var(--blue);border-radius:20px;padding:5px 9px;font-size:11px}.tag.orange{background:#fff1d9;color:#8a5200}.notice{padding:12px 14px;border-radius:10px;background:#fff1d9;color:#694300;margin:12px 0;font-size:13px}.error{background:#feeceb;color:var(--red)}.success{background:#e8f7ef;color:#146c40}.hidden{display:none!important}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{flex:1;min-width:145px;border:1px solid #cbd6e4;border-radius:10px;padding:10px;background:white}.small{font-size:12px}.footer{text-align:center;color:var(--muted);padding:24px;font-size:11px}.brandmark{display:inline-flex;background:var(--blue);color:white;padding:3px 6px;border-radius:5px;font-size:10px}
@media(max-width:760px){.shell{padding:12px}.top{padding:12px}.brand h1{font-size:16px}.layout{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{font-size:13px;padding:10px}.stats{grid-template-columns:1fr 1fr}.card{padding:16px}.login{margin:4vh auto}.row>*{min-width:100%}.top .row>*{min-width:0;flex:initial}}@media(max-width:420px){.stats{grid-template-columns:1fr}.top{align-items:flex-start}.brand p{max-width:190px}}
</style></head><body>
<header class="top"><div class="brand"><img class="logo" src="icon.svg" alt="St Mark"><div><h1>St. Mark Report</h1><p>نظام التقارير اليومية — فروع سان مارك</p></div></div><div class="row" style="flex:initial"><span id="who" class="muted"></span><button id="logout" class="soft hidden" onclick="logout()">تسجيل الخروج</button></div></header>
<main class="shell"><section id="loginView" class="card login"><h2>تسجيل الدخول</h2><p class="muted">استخدم البريد الإلكتروني وكلمة المرور المعتمدين لحسابك.</p><div id="loginMsg" class="notice hidden"></div><form id="loginForm"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%" type="submit">دخول آمن</button></form><p class="muted small">لا يوجد إنشاء حساب عام. حسابات المشرفين يجب اعتمادها مسبقًا من الإدارة.</p></section>
<section id="appView" class="hidden"><div class="row" style="margin:18px 0"><div><h2 id="welcome" style="margin:0;color:var(--blue)">أهلاً بك</h2><p id="subtitle" class="muted" style="margin:5px 0"></p></div><span id="roleTag" class="tag">الحساب</span></div><div id="appMsg" class="notice hidden"></div><div class="layout"><nav id="nav" class="nav"></nav><div id="page" class="content"></div></div></section></main><footer class="footer">St. Mark Report · التقارير اليومية للفروع</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Publishable browser key only. Database access must be protected by Supabase RLS policies.
const SUPABASE_URL='https://ismqqmuoilsdxrkjmqjm.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_9nIrbEWf_FwuoS5DTmHFXw_knL8K3oP';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const BRANCHES=['الخطاطبة','قنا','السخنة'];const DEPARTMENTS=['مشرف مطعم','مشرف هاوس كيبنج','مشرف مخازن','مشرف مشاريع','مشرف مطبخ','مشرف بوابة','مشرف زراعة','مشرف Front Office (الحسابات)'];
let user=null,profile=null,reports=[],activePage='reports';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(text,type=''){const el=$('appMsg');el.className='notice '+type;el.textContent=text;el.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}function hideMsg(){$('appMsg').classList.add('hidden')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').classList.add('hidden');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='تعذر تسجيل الدخول: '+error.message;$('loginMsg').className='notice error';return;}await boot();});
async function logout(){await sb.auth.signOut();user=null;profile=null;$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('logout').classList.add('hidden');$('who').textContent='';}
async function boot(){const {data:{session}}=await sb.auth.getSession();user=session?.user;if(!user){$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');$('logout').classList.add('hidden');return;}const {data,error}=await sb.from('profiles').select('id,email,full_name,role,branch_id,department_id,active,branches(name),departments(name)').eq('id',user.id).maybeSingle();if(error||!data){await sb.auth.signOut();$('loginMsg').textContent='الحساب موجود لكن ملف الصلاحيات غير مُعدّ في جدول profiles. راجع ملف SETUP_AR.md.';$('loginMsg').className='notice error';$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');return;}if(data.active===false){await sb.auth.signOut();$('loginMsg').textContent='هذا الحساب موقوف. تواصل مع الإدارة.';$('loginMsg').className='notice error';return;}profile=data;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent=data.full_name||data.email||user.email;$('welcome').textContent='أهلاً بك '+(data.full_name||data.email||'');$('subtitle').textContent=data.role==='manager'?'لوحة متابعة التقارير — جميع الفروع':'نموذج التقرير اليومي';$('roleTag').textContent=data.role==='manager'?'مدير النظام':'مشرف';renderNav();await showPage(data.role==='manager'?'reports':'submit');}
function renderNav(){const items=profile.role==='manager'?[['reports','التقارير'],['staff','المشرفون'],['settings','إعدادات النظام']]:[['submit','تقرير يومي'],['mine','تقاريري السابقة']];$('nav').innerHTML=items.map(([k,v])=>`<button class="${activePage===k?'active':''}" onclick="showPage('${k}')">${v}</button>`).join('');}
async function showPage(p){activePage=p;renderNav();hideMsg();if(profile.role!=='manager'&&!['submit','mine'].includes(p))p='submit';if(profile.role==='manager'&&!['reports','staff','settings'].includes(p))p='reports';if(p==='submit')return renderSubmit();if(p==='mine')return loadReports(false);if(p==='reports')return loadReports(true);if(p==='staff')return renderStaff();if(p==='settings')return renderSettings();}
function renderSubmit(){const branch=profile.branches?.name||'غير محدد',dept=profile.departments?.name||'غير محدد';$('page').innerHTML=`<div class="card"><h2>تقرير يومي</h2><p class="muted">املأ ما تم إنجازه والملاحظات أو الشكاوى. لا ترسل التقرير إلا بعد مراجعة البيانات.</p><div class="row"><div class="field"><label>الفرع</label><input value="${esc(branch)}" disabled></div><div class="field"><label>القسم</label><input value="${esc(dept)}" disabled></div></div><form id="reportForm"><div class="field"><label for="reportDate">تاريخ التقرير</label><input id="reportDate" type="date" value="${new Date().toLocaleDateString('en-CA')}" required></div><div class="field"><label for="workDone">الأعمال التي تم إنجازها</label><textarea id="workDone" required placeholder="اكتب الأعمال التي تم إنجازها اليوم..."></textarea></div><div class="field"><label for="complaints">الشكاوى والملاحظات (اختياري)</label><textarea id="complaints" placeholder="اكتب أي شكاوى أو ملاحظات..."></textarea></div><button class="primary" type="submit">إرسال التقرير</button></form></div>`;$('reportForm').addEventListener('submit',async e=>{e.preventDefault();const payload={supervisor_id:user.id,branch_id:profile.branch_id,department_id:profile.department_id,report_date:$('reportDate').value,work_done:$('workDone').value.trim(),complaints:$('complaints').value.trim(),review_status:'جديد'};const {error}=await sb.from('reports').insert(payload);if(error){msg('لم يتم إرسال التقرير: '+error.message,'error');return;}msg('تم إرسال التقرير بنجاح.','success');renderSubmit();});}
async function loadReports(manager){$('page').innerHTML=`<div class="card"><h2>${manager?'كل التقارير':'تقاريري السابقة'}</h2><p class="muted">${manager?'ابحث في محتوى التقارير أو صفِّ النتائج حسب الفرع والقسم والتاريخ.':'هذه التقارير التي أرسلتها من حسابك.'}</p><div class="toolbar"><input id="search" placeholder="بحث بالاسم أو المحتوى...">${manager?`<select id="branchFilter"><option value="">كل الفروع</option>${BRANCHES.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="deptFilter"><option value="">كل الأقسام</option>${DEPARTMENTS.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:''}<input id="dateFilter" type="date" title="تصفية بالتاريخ"><button class="soft" onclick="applyFilters(${manager})">بحث</button></div><div id="reportStats" class="stats"></div><div id="reportTable" class="table-wrap"><p class="muted" style="padding:15px">جارٍ تحميل التقارير...</p></div><div class="row" style="margin-top:12px"><button class="soft" onclick="moveReport(-1)">التقرير السابق</button><span id="reportPosition" class="muted" style="text-align:center">—</span><button class="soft" onclick="moveReport(1)">التقرير التالي</button></div><div id="reportDetail" style="margin-top:14px"></div></div>`;const q=sb.from('reports').select('id,report_date,work_done,complaints,review_status,manager_notes,created_at,supervisor_id,branch_id,department_id,profiles:profiles!reports_supervisor_id_fkey(full_name,email),branches:branches!reports_branch_id_fkey(name),departments:departments!reports_department_id_fkey(name)').order('report_date',{ascending:false}).order('created_at',{ascending:false}).limit(500);const {data,error}=manager?await q:await q.eq('supervisor_id',user.id);if(error){$('reportTable').innerHTML=`<p class="notice error">تعذر تحميل التقارير: ${esc(error.message)}. تأكد من تشغيل ملف SQL المرفق.</p>`;return;}reports=data||[];window.reportIndex=0;applyFilters(manager);}
let filtered=[];function applyFilters(manager){const search=($('search')?.value||'').trim().toLowerCase(),branch=$('branchFilter')?.value||'',dept=$('deptFilter')?.value||'',date=$('dateFilter')?.value||'';filtered=reports.filter(r=>{const hay=[r.report_date,r.work_done,r.complaints,r.manager_notes,r.review_status,r.profiles?.full_name,r.profiles?.email,r.branches?.name,r.departments?.name].join(' ').toLowerCase();return (!search||hay.includes(search))&&(!branch||r.branches?.name===branch)&&(!dept||r.departments?.name===dept)&&(!date||r.report_date===date)});$('reportStats').innerHTML=`<div class="stat"><span class="muted">عدد النتائج</span><strong>${filtered.length}</strong></div><div class="stat"><span class="muted">جديد</span><strong>${filtered.filter(r=>r.review_status==='جديد').length}</strong></div><div class="stat"><span class="muted">متابعة مطلوبة</span><strong>${filtered.filter(r=>r.review_status==='متابعة مطلوبة').length}</strong></div>`;$('reportTable').innerHTML=filtered.length?`<table><thead><tr><th>التاريخ</th>${manager?'<th>المشرف</th>':''}<th>الفرع</th><th>القسم</th><th>الحالة</th><th>محتوى التقرير</th><th>إجراء</th></tr></thead><tbody>${filtered.map((r,i)=>`<tr><td>${esc(r.report_date)}</td>${manager?`<td>${esc(r.profiles?.full_name||r.profiles?.email||'—')}</td>`:''}<td>${esc(r.branches?.name||'—')}</td><td>${esc(r.departments?.name||'—')}</td><td><span class="tag ${r.review_status==='متابعة مطلوبة'?'orange':''}">${esc(r.review_status||'جديد')}</span></td><td>${esc((r.work_done||'').slice(0,100))}${(r.work_done||'').length>100?'…':''}</td><td><button class="soft" onclick="openReport('${r.id}')">عرض</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted" style="padding:16px">لا توجد تقارير مطابقة للبحث.</p>';window.reportIndex=Math.min(window.reportIndex||0,Math.max(0,filtered.length-1));showReportAt(window.reportIndex);}
function moveReport(n){if(!filtered.length)return;window.reportIndex=Math.max(0,Math.min(filtered.length-1,(window.reportIndex||0)+n));showReportAt(window.reportIndex)}function openReport(id){window.reportIndex=filtered.findIndex(r=>r.id===id);showReportAt(window.reportIndex)}function showReportAt(i){const r=filtered[i];$('reportPosition').textContent=r?`${i+1} من ${filtered.length}`:'لا توجد نتائج';if(!r){$('reportDetail').innerHTML='';return;}$('reportDetail').innerHTML=`<div class="card"><h2>تفاصيل التقرير</h2><p class="muted">${esc(r.report_date)} · ${esc(r.profiles?.full_name||r.profiles?.email||'')}</p><h3>الأعمال المنجزة</h3><p style="white-space:pre-wrap;line-height:1.8">${esc(r.work_done||'—')}</p><h3>الشكاوى والملاحظات</h3><p style="white-space:pre-wrap;line-height:1.8">${esc(r.complaints||'لا توجد')}</p>${profile.role==='manager'?`<div class="field"><label>حالة المراجعة</label><select id="detailStatus"><option ${r.review_status==='جديد'?'selected':''}>جديد</option><option ${r.review_status==='تمت المراجعة'?'selected':''}>تمت المراجعة</option><option ${r.review_status==='متابعة مطلوبة'?'selected':''}>متابعة مطلوبة</option></select></div><div class="field"><label>ملاحظات المدير</label><textarea id="managerNotes">${esc(r.manager_notes||'')}</textarea></div><button class="primary" onclick="saveReview('${r.id}')">حفظ المراجعة</button>`:`<p><b>حالة المراجعة:</b> ${esc(r.review_status||'جديد')}</p>${r.manager_notes?`<p><b>ملاحظات الإدارة:</b> ${esc(r.manager_notes)}</p>`:''}`}</div>`;}
async function saveReview(id){const {error}=await sb.from('reports').update({review_status:$('detailStatus').value,manager_notes:$('managerNotes').value.trim(),reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error){msg('تعذر حفظ المراجعة: '+error.message,'error');return;}msg('تم حفظ المراجعة.','success');await loadReports(true);openReport(id);}
async function renderStaff(){ $('page').innerHTML=`<div class="card"><h2>إدارة المشرفين</h2><p class="muted">لأمان الحسابات، أنشئ حساب المشرف من Supabase Authentication ثم أضف بياناته هنا. لا يمكن للواجهة إنشاء مستخدم Auth بأمان دون دعوة خادمية.</p><div class="notice">إضافة مشرف: أدخل UUID الخاص بالمستخدم من Authentication → Users، ثم الاسم والفرع والقسم. هذا يمنع إنشاء حسابات غير معتمدة.</div><form id="staffForm"><div class="field"><label>معرّف المستخدم UUID</label><input id="staffId" required placeholder="انسخ User UID من Supabase"></div><div class="field"><label>الاسم</label><input id="staffName" required></div><div class="field"><label>البريد الإلكتروني</label><input id="staffEmail" type="email" required></div><div class="row"><div class="field"><label>الفرع</label><select id="staffBranch">${BRANCHES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>القسم</label><select id="staffDept">${DEPARTMENTS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><button class="primary">حفظ المشرف</button></form><div id="staffList" class="table-wrap">جارٍ التحميل...</div></div>`;await fetchStaff();$('staffForm').addEventListener('submit',async e=>{e.preventDefault();const [{data:b},{data:d}]=await Promise.all([sb.from('branches').select('id').eq('name',$('staffBranch').value).single(),sb.from('departments').select('id').eq('name',$('staffDept').value).single()]);if(!b||!d){msg('لم يتم العثور على الفرع أو القسم. شغّل ملف SQL المرفق.','error');return;}const {error}=await sb.from('profiles').upsert({id:$('staffId').value.trim(),email:$('staffEmail').value.trim(),full_name:$('staffName').value.trim(),role:'supervisor',branch_id:b.id,department_id:d.id,active:true});if(error){msg('تعذر حفظ المشرف: '+error.message,'error');return;}msg('تم حفظ بيانات المشرف.','success');$('staffForm').reset();fetchStaff();});}
async function fetchStaff(){const {data,error}=await sb.from('profiles').select('id,email,full_name,active,branches(name),departments(name)').eq('role','supervisor').order('full_name');$('staffList').innerHTML=error?`<p class="notice error">${esc(error.message)}</p>`:`<table><thead><tr><th>الاسم</th><th>البريد</th><th>الفرع</th><th>القسم</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${(data||[]).map(s=>`<tr><td>${esc(s.full_name||'—')}</td><td>${esc(s.email||'—')}</td><td>${esc(s.branches?.name||'—')}</td><td>${esc(s.departments?.name||'—')}</td><td>${s.active===false?'موقوف':'نشط'}</td><td><button class="${s.active===false?'soft':'danger'}" onclick="toggleStaff('${s.id}',${s.active===false})">${s.active===false?'تفعيل':'إيقاف'}</button></td></tr>`).join('')}</tbody></table>`;}
async function toggleStaff(id,active){const {error}=await sb.from('profiles').update({active}).eq('id',id);if(error){msg('تعذر تغيير حالة المشرف: '+error.message,'error');return;}msg(active?'تم تفعيل المشرف.':'تم إيقاف المشرف.','success');fetchStaff();}
function renderSettings(){$('page').innerHTML=`<div class="card"><h2>إعدادات النظام</h2><p class="muted">الفروع والأقسام المستخدمة في النظام.</p><h3>الفروع</h3>${BRANCHES.map(x=>`<p>• ${esc(x)}</p>`).join('')}<h3>الأقسام</h3>${DEPARTMENTS.map(x=>`<p>• ${esc(x)}</p>`).join('')}<div class="notice">قبل إرسال الرابط للمدير: نفّذ ملف database_setup.sql في Supabase SQL Editor، ثم تأكد أن حساب المدير له سجل في profiles بدور manager.</div></div>`}
sb.auth.onAuthStateChange((_event,session)=>{if(session?.user&&!profile)setTimeout(boot,0);});boot();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
